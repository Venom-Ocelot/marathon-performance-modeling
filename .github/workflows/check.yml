name: Check published artifacts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install artifact checking dependencies
        run: python -m pip install 'nbformat>=5.10,<6' 'pillow>=10,<14'
      - name: Check notebook, reports, figures, and repository contents
        run: python scripts/check_artifacts.py
